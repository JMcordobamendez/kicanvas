# Fork only: formats the branch with prettier and pushes the result, so nothing
# has to be installed or run locally. Run it by hand on a branch.
name: Fork format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run format
      - name: Commit the formatting
        run: |
          if git diff --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "José Miguel Córdoba Méndez"
          git config user.email "79694677+JMcordobamendez@users.noreply.github.com"
          git commit -am "style: format with prettier"
          git push
